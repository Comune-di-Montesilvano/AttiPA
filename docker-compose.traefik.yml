# OPZIONALE: esposizione tramite un Traefik v3 gia' in esecuzione sullo stesso host
# (provider docker), al posto della porta ADMIN_PORT.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# Portainer (stack Git): Compose path docker-compose.yml, Additional paths
# docker-compose.traefik.yml.
#
# Variabili dello stack:
#   TRAEFIK_HOST_ADMIN        (obbligatoria) hostname, es. attipa.ente.it
#   TRAEFIK_ADMIN_MIDDLEWARES middleware gia' definiti in Traefik, separati da virgola
#                             (es. lan-only@docker per la sola rete interna). Default: nessuno
#   TRAEFIK_NETWORK           rete docker esterna condivisa con Traefik (default: proxy)
#   TRAEFIK_ENTRYPOINT        entrypoint HTTPS di Traefik (default: websecure)
#   TRAEFIK_ROUTER_PREFIX     prefisso di router e service, unico per istanza (default: attipa)

x-traefik-admin: &traefik-admin
  - traefik.enable=true
  - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-attipa}-admin.rule=Host(`${TRAEFIK_HOST_ADMIN:?TRAEFIK_HOST_ADMIN obbligatoria}`)
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-attipa}-admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-attipa}-admin.tls=true
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-attipa}-admin.middlewares=${TRAEFIK_ADMIN_MIDDLEWARES:-}
  - traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-attipa}-admin.loadbalancer.server.port=8080

services:

  frontend-admin:
    # Nessuna porta sull'host: si entra solo da Traefik.
    ports: !reset []
    networks:
      - attipa-net
      - traefik
    labels: *traefik-admin

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
