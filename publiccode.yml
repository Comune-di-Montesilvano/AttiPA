description:
  it:
    localisedName: AttiPA
    shortDescription: >-
      Redazione assistita di atti amministrativi (determine, ordinanze,
      variazioni di bilancio) su contabilità, regolamenti e normativa.
    longDescription: >-
      AttiPA aiuta gli uffici di un ente locale a redigere atti
      amministrativi: determine di affidamento e di impegno, ordinanze,
      decreti, richieste di variazione di bilancio, atti del personale.
      Interroga in sola lettura la contabilità dell'ente (Tinn, Firebird)
      per capitoli, disponibilità, impegni e storico dei fornitori, e si
      appoggia ai regolamenti interni e alla normativa nazionale per
      proporre testi e controlli.


      Il modello linguistico è a scelta dell'ente: per default un modello
      locale tramite endpoint compatibile OpenAI, così i dati contabili e
      personali non escono dall'infrastruttura dell'ente. L'intero stack
      gira in Docker, con immagini firmate e filesystem in sola lettura.
    features:
      - Sincronizzazione giornaliera del backup della contabilità Tinn
      - Query in sola lettura su capitoli, disponibilità e impegni
      - Conversione dei modelli di atto (RTF/DOCX/ODT → PDF)
      - Modello linguistico configurabile, locale per default

