# Backend risolto di continuo, non una volta sola all'avvio: un redeploy che ricrea solo il
# backend gli da' un IP nuovo e nginx restava sul vecchio ("113: Host is unreachable",
# produzione 2026-11-04). `resolve` (nginx >= 1.27.3) ririsolve il nome alla scadenza del
# resolver; il resolver (DNS della rete dei container) lo scrive 20-runtime-config.sh.
# Upstream con nome e proxy_pass senza variabili: strip di /api/ e URI identici a prima.
include /tmp/runtime-config/resolver.conf;

upstream backend_api {
    zone backend_api 64k;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js e index.html: MAI in cache per forzare l'invalidazione istantanea ad ogni nuovo rilascio
    # Generato all'avvio da 20-runtime-config.sh in /tmp (filesystem in sola lettura).
    location = /config.js {
        root /tmp/runtime-config;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets con hash di Vite (es. /assets/*.js, /assets/*.css): cache 1 anno
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # Proxy interno verso il backend sulla rete Docker
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # Assistente: un modello locale su CPU può impiegare minuti (LLM_TIMEOUT_MS per chiamata,
    # più chiamate per risposta). Il default di 60 s chiuderebbe la richiesta.
    location /api/assistant/ {
        proxy_pass http://backend_api/assistant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Server MCP: query Tinn lunghe (decine di secondi) e risposte SSE dei client 2025.
    location = /api/mcp {
        proxy_pass http://backend_api/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
