name: attipa

# PRODUZIONE (podman rootless / Portainer): immagini da registry, solo volumi
# named, nessun bind mount. Per lo sviluppo vedi docker-compose.override.yml
# (attivato da COMPOSE_FILE in .env).
#
# Filesystem dei container in sola lettura: scrivono solo nei volumi e nei tmpfs
# dichiarati. Nessuna escalation di privilegi e nessuna capability Linux.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Postgres scrive come utente postgres sui file del volume: servono queste capability
# (cap_drop ALL le toglierebbe), nient'altro.
x-db-caps: &db-caps
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID

services:

  # Verifica delle firme cosign delle 4 immagini di ${IMAGE_TAG} prima di avviarle
  # (VERIFY_IMAGES=true): firmate da release.yml di questo repo su un tag v* o su main.
  # Se fallisce, gli altri servizi restano creati ma non avviati. Spenta (default),
  # esce subito con successo.
  verify-images:
    <<: *hardening
    image: ghcr.io/sigstore/cosign/cosign:v3.1.6-dev@sha256:92c6e36fa840ec72f6c54a2c064a9de5c64fd6f489ce7eaa04641c8ee84cca58
    restart: "no"
    read_only: true
    tmpfs:
      - /home/nonroot:mode=1777
    environment:
      VERIFY_IMAGES: ${VERIFY_IMAGES:-false}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    entrypoint: ["/busybox/sh", "-ec"]
    command:
      - |
        if [ "$$VERIFY_IMAGES" != "true" ]; then
          echo "Verifica firme disattivata (VERIFY_IMAGES=$$VERIFY_IMAGES)"
          exit 0
        fi
        R=ghcr.io/comune-di-montesilvano/attipa
        cosign verify \
          --certificate-identity-regexp '^https://github\.com/Comune-di-Montesilvano/AttiPA/\.github/workflows/release\.yml@refs/(tags/v.*|heads/main)$$' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "$$R-backend:$$IMAGE_TAG" "$$R-frontend-admin:$$IMAGE_TAG" \
          "$$R-tinn-gateway:$$IMAGE_TAG" "$$R-docgen:$$IMAGE_TAG" >/dev/null
        echo "Firme verificate: $$IMAGE_TAG"

  # Postgres 18 con pgvector (ricerca semantica su regolamenti e atti).
  postgres:
    <<: [*hardening, *db-caps]
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obbligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria - genera con openssl rand -hex 16}
      POSTGRES_DB: ${POSTGRES_DB:-attipa}
    volumes:
      # Postgres 18+: un solo mount su /var/lib/postgresql (dati in 18/docker).
      - postgres_data:/var/lib/postgresql
    networks:
      - attipa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/attipa-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    # Nessuna porta sull'host: il frontend raggiunge backend:8080 sulla rete interna.
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attipa}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obbligatorio - genera con openssl rand -hex 32}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-%s}
      LDAP_TLS_SKIP_VERIFY: ${LDAP_TLS_SKIP_VERIFY:-false}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_REQUIRED_GROUP: ${LDAP_REQUIRED_GROUP:-ATTIPA_USERS}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-ATTIPA_ADMINS}
      LDAP_ADMIN_USERNAMES: ${LDAP_ADMIN_USERNAMES:-}
      TINN_GATEWAY_URL: http://tinn-gateway:8000
      DOCGEN_URL: http://docgen:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      LLM_MAX_STEPS: ${LLM_MAX_STEPS:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_TOKEN_MAX_DAYS: ${MCP_TOKEN_MAX_DAYS:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
    tmpfs:
      - /tmp
    depends_on:
      verify-images:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - attipa-net

  # DB Tinn (Firebird 5 embedded) ripristinato ogni giorno dal backup SFTP del fornitore
  # e interrogato in sola lettura con le query di services/tinn-gateway/queries.
  tinn-gateway:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/attipa-tinn-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TINN_SFTP_HOST: ${TINN_SFTP_HOST:-}
      TINN_SFTP_PORT: ${TINN_SFTP_PORT:-22}
      TINN_SFTP_USER: ${TINN_SFTP_USER:-}
      TINN_SFTP_PASSWORD: ${TINN_SFTP_PASSWORD:-}
      TINN_SFTP_PATH: ${TINN_SFTP_PATH:-}
      TINN_DB_FILE: ${TINN_DB_FILE:-}
      TINN_SFTP_HOST_KEY: ${TINN_SFTP_HOST_KEY:-}
      # Ora della sync giornaliera (vuota = nessuna sync automatica).
      TINN_SYNC_HOUR: ${TINN_SYNC_HOUR:-6}
    volumes:
      # DB ripristinato, state.json, known_hosts del server SFTP.
      - tinn_data:/data
    depends_on:
      verify-images:
        condition: service_completed_successfully
    networks:
      - attipa-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  docgen:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/attipa-docgen:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      # Profilo LibreOffice e file di lavoro delle conversioni.
      - /tmp:size=512m
    depends_on:
      verify-images:
        condition: service_completed_successfully
    networks:
      - attipa-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Modello locale (facoltativo): `docker compose --profile llm-locale up -d`, poi
  # `docker compose exec ollama ollama pull <modello>`. Solo rete interna, nessuna porta
  # sull'host: i dati inviati al modello non escono dal server. Senza GPU usare modelli
  # piccoli (es. qwen3:4b / qwen3:8b).
  ollama:
    <<: *hardening
    image: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    profiles: [llm-locale]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Modello caricato in memoria più a lungo tra due richieste (default 5 minuti).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      # Modelli scaricati (diversi GB).
      - ollama_data:/root/.ollama
    networks:
      - attipa-net

  frontend-admin:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/attipa-frontend-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    # pid e file temporanei di nginx, config.js generato all'avvio.
    tmpfs:
      - /tmp
    ports:
      - "${ADMIN_PORT:-3000}:8080"
    depends_on:
      verify-images:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - attipa-net

volumes:
  postgres_data:
  tinn_data:
  ollama_data:

networks:
  attipa-net:
    driver: bridge
